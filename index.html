<!DOCTYPE html>

<html lang="fr">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dino Logic</title>

<link
    rel="manifest"
    href="manifest.json"
>

<!-- CSS -->

<link
    rel="stylesheet"
    href="css/style.css"
>


</head>

<body>


<main class="app">

    <h1>
        🦖 Dino Logic
    </h1>


    <p class="subtitle">
        Trouve l'emplacement de tous les dinos.
    </p>


    <!-- Message d'état -->

    <div
        id="status"
        class="status"
        aria-live="polite"
    >
        Chargement...
    </div>


    <!-- Choix de la taille -->

    <div class="settings">

        <label for="gridSize">
            Taille de la grille
        </label>


        <select
            id="gridSize"
        >

            <option value="4">
                4 × 4
            </option>

            <option value="5">
                5 × 5
            </option>

            <option
                value="6"
                selected
            >
                6 × 6
            </option>

            <option value="7">
                7 × 7
            </option>

            <option value="8">
                8 × 8
            </option>

        </select>

    </div>


    <!-- Grille -->

    <div
        id="board"
        class="board"
        aria-label="Grille de jeu"
    ></div>


    <!-- Boutons -->

    <div class="buttons">

        <button
            id="undo"
            class="action"
            type="button"
        >
            ↶ Annuler
        </button>


        <button
            id="clear"
            class="action"
            type="button"
        >
            Effacer
        </button>


        <button
            id="newGame"
            class="action primary"
            type="button"
        >
            Nouvelle grille
        </button>

    </div>


    <!-- Règles -->

    <div class="rules">

        <strong>
            Règles
        </strong>


        <ul>

            <li>
                🦖 Un dino par zone de couleur.
            </li>

            <li>
                🦖 Un dino par ligne.
            </li>

            <li>
                🦖 Un dino par colonne.
            </li>

            <li>
                🦖 Deux dinos ne peuvent pas se toucher,
                même en diagonale.
            </li>

        </ul>

    </div>

</main>


<!--
    IMPORTANT :

    type="module" permet à main.js d'utiliser
    import/export avec les autres fichiers.
-->

<script
    type="module"
    src="js/main.js"
></script>


</body>

</html>
