<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5d9df">
    <meta name="description" content="Little Pink Sloth, votre collection de mini-jeux.">
    <title>Little Pink Sloth</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="launcher/launcher.css">
</head>
<body>
    <main class="launcher">
        <header class="masthead">
            <p class="eyebrow">LA COLLECTION</p>
            <h1>Little Pink <span>Sloth</span></h1>
            <p class="lede">Des petits jeux, à votre rythme.</p>
        </header>
        <section aria-labelledby="games-heading">
            <div class="section-heading">
                <h2 id="games-heading">Vos jeux</h2>
                <p id="connection-state" aria-live="polite">Chargement…</p>
            </div>
            <div id="games-list" class="games-list" aria-live="polite"></div>
        </section>
        <p id="launcher-message" class="launcher-message" role="status"></p>
    </main>
    <script type="module" src="launcher/launcher.js"></script>
</body>
</html>
